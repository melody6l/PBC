<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件核对工具</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand">
                <div class="brand-mark">PBC</div>
                <div class="brand-copy">
                    <div class="brand-title">文件核对工具</div>
                </div>
            </div>
        </div>
        <div class="accent-line"></div>
    </header>
    <div class="container">
        <!-- 主流程 -->
        <div class="panel workflow-panel" id="workflow-panel">
            <div class="workflow-title">
                <div class="panel-title">
                    <span>&#128203; 首屏主流程</span>
                    <span class="badge" id="workflow-state-badge">步骤 1-3</span>
                </div>
            </div>
            <div class="workflow-steps">
                <div class="panel workflow-step-card" id="workflow-step-1">
                    <div class="panel-title">
                        <span>步骤 1 · 上传清单</span>
                        <span class="badge" id="checklist-badge">未加载</span>
                    </div>
                    <div class="upload-area" id="upload-area">
                        <div class="upload-empty" id="upload-empty">
                            <button class="btn btn-outline btn-sm" id="upload-trigger-btn" type="button">点击上传 .xlsx</button>
                            <p>或将文件拖拽到此处</p>
                        </div>
                        <div class="upload-done hidden" id="upload-done">
                            <div class="upload-summary" id="upload-summary"></div>
                            <button class="btn btn-outline btn-sm" id="reupload-btn" type="button">重新上传</button>
                        </div>
                    </div>
                    <input type="file" id="checklist-input" accept=".xlsx" class="hidden">
                </div>

                <div class="step-arrow">→</div>

                <div class="panel workflow-step-card" id="workflow-step-2">
                    <div class="panel-title">
                        <span>步骤 2 · 选择文件夹</span>
                        <span class="badge" id="folder-badge">未扫描</span>
                    </div>
                    <div class="folder-input-group">
                        <input type="text" id="folder-path" placeholder="请输入文件夹路径，如: D:\\客户资料\\2024年度">
                        <button class="btn btn-primary" id="scan-btn">&#128270; 扫描</button>
                    </div>
                </div>

                <div class="step-arrow">→</div>

                <div class="panel workflow-step-card" id="workflow-step-3">
                    <div class="panel-title">
                        <span>步骤 3 · 开始匹配</span>
                        <span class="badge" id="match-badge">待匹配</span>
                    </div>
                    <!-- 名称列选择（上传后显示） -->
                    <div class="name-col-selector hidden" id="name-col-selector">
                        <label>文件名称列:</label>
                        <select id="name-col-select"></select>
                    </div>
                    <div class="match-options">
                        <label class="match-option">
                            <input type="checkbox" id="smart-match-enabled" checked disabled>
                            <span>智能模式匹配（推荐）</span>
                        </label>
                        <label class="match-option">
                            <input type="checkbox" id="llm-enabled">
                            <span>AI辅助匹配（可选）</span>
                        </label>
                        <label class="match-option hidden" id="incremental-match-wrap">
                            <input type="checkbox" id="incremental-match" checked>
                            <span>增量匹配（保留已获取项）</span>
                        </label>
                    </div>
                    <div class="llm-config-summary hidden" id="llm-config-summary">
                        <span class="llm-config-tag" id="llm-config-tag" title="点击修改配置">已配置</span>
                    </div>
                    <div class="mode-selector">
                        <select id="match-mode">
                            <option value="fuzzy">模糊匹配（关键词包含）</option>
                            <option value="exact">精确匹配（文件名完全一致）</option>
                        </select>
                    </div>
                    <button class="btn btn-success btn-match" id="match-btn">&#9889; 开始匹配</button>
                    <span class="llm-status hidden" id="llm-status">正在匹配中...</span>
                    <div class="progress-bar">
                        <div class="fill" id="progress-fill" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="stats hidden" id="stats-section">
            <div class="stat-card total">
                <div class="stat-value" id="stat-total">0</div>
                <div class="stat-label">清单总数</div>
            </div>
            <div class="stat-card matched">
                <div class="stat-value" id="stat-matched">0</div>
                <div class="stat-label">已获取</div>
            </div>
            <div class="stat-card incomplete">
                <div class="stat-value" id="stat-incomplete">0</div>
                <div class="stat-label">部分获取</div>
            </div>
            <div class="stat-card missing">
                <div class="stat-value" id="stat-missing">0</div>
                <div class="stat-label">未获取</div>
            </div>
        </div>

        <div class="panel hidden" id="diff-section">
            <div class="panel-title">
                <span>更新对比</span>
                <span class="badge" id="diff-badge">本次扫描</span>
            </div>
            <div id="diff-content"></div>
        </div>

        <!-- 分屏：左侧清单表格 + 右侧文件树 -->
        <div class="split-view hidden" id="split-view">
            <!-- 核对清单 -->
            <div class="panel" id="main-table-section">
                <div class="panel-title">
                    <span>&#128203; 文件核对清单</span>
                    <div class="panel-actions">
                        <div class="col-toggle-panel" id="col-toggle-panel">
                            <button class="btn btn-outline btn-sm" id="col-toggle-btn">&#128065; 显示列</button>
                            <div class="col-toggle-dropdown hidden" id="col-toggle-dropdown"></div>
                        </div>
                        <button class="btn btn-success btn-sm hidden" id="export-btn">&#128190; 导出Excel</button>
                        <button class="btn btn-outline btn-sm" id="toggle-tree-btn">&#128194; 显示资料</button>
                    </div>
                </div>
                <div class="result-table-wrapper" id="result-table-wrapper">
                    <table class="result-table" id="main-table">
                        <thead id="main-table-head"></thead>
                        <tbody id="main-table-body"></tbody>
                    </table>
                </div>
            </div>

            <!-- 右侧：文件树浏览器 -->
            <div class="file-tree-panel" id="file-tree-panel">
                <div class="panel-title">
                    &#128193; 资料浏览
                    <button class="tree-close-btn" id="tree-close-btn" title="收起">&#10005;</button>
                </div>
                <div class="file-tree" id="file-tree"></div>
            </div>
        </div>

        <!-- 空状态 -->
        <div class="empty-state" id="empty-state">
            <div class="empty-icon">&#128194;</div>
            <p>请先上传需求文件清单，再扫描客户资料文件夹</p>
        </div>
    </div>

    <!-- 提示消息 -->
    <div class="llm-config-modal hidden" id="llm-config-modal">
        <div class="llm-modal-content">
            <h3>AI辅助匹配配置</h3>
            <div class="llm-form-group">
                <label>模型</label>
                <select id="llm-provider">
                    <option value="deepseek">DeepSeek</option>
                    <option value="openai-gpt4o-mini">OpenAI GPT-4o-mini</option>
                    <option value="openai-gpt4o">OpenAI GPT-4o</option>
                    <option value="zhipu-glm4">智谱 GLM-4</option>
                    <option value="ollama">Ollama (本地)</option>
                </select>
            </div>
            <div class="llm-form-group">
                <label>API Key</label>
                <input type="password" id="llm-api-key" placeholder="输入API Key（Ollama可留空）">
            </div>
            <div class="llm-form-group">
                <label>Base URL</label>
                <input type="text" id="llm-base-url" placeholder="默认自动填充">
                <span class="hint" id="llm-base-url-hint"></span>
            </div>
            <div class="llm-modal-actions">
                <button class="btn btn-outline" id="llm-cancel-btn">取消</button>
                <button class="btn btn-primary" id="llm-save-btn">保存配置</button>
            </div>
        </div>
    </div>
    <div class="status-context-menu hidden" id="status-context-menu">
        <button type="button" data-status="已获取">&#10003; 已获取</button>
        <button type="button" data-status="部分获取">&#9888; 部分获取</button>
        <button type="button" data-status="未获取">&#10007; 未获取</button>
    </div>
    <div class="toast" id="toast"></div>

    <script src="/static/js/main.js"></script>
</body>
</html>
